<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Better Crunchyroll</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup" aria-label="Better Crunchyroll">
      <header class="popup__header" id="mainHeader">
        <img class="popup__logo" src="icons/icon128.png" alt="Better Crunchyroll" />
        <button id="settingsButton" class="icon-button" type="button" aria-label="Open settings" title="Settings">⚙</button>
      </header>

      <section id="mainView" class="view main-view" aria-label="Extension controls">
        <div class="control">
          <button id="toggleButton" class="switch" type="button" role="switch" aria-checked="true" aria-label="Toggle Better Crunchyroll">
            <span class="switch__thumb" aria-hidden="true"></span>
          </button>
        </div>
      </section>

      <section id="settingsView" class="view settings-view" hidden aria-label="Better Crunchyroll settings">
        <div class="settings-header">
          <button id="backSettingsButton" class="back-settings-button" type="button" aria-label="Back to main page" title="Back">
            <span aria-hidden="true">←</span>
          </button>
          <strong class="settings-title">Settings</strong>
        </div>

        <section class="settings-section" aria-labelledby="skipSectionTitle">
          <div id="skipSectionTitle" class="section-title">Skipping</div>
          <div class="setting-row"><span>Skip intro automatically</span><button id="autoSkipIntro" class="setting-toggle" type="button" role="switch" aria-checked="false"><span></span></button></div>
          <div class="setting-row"><span>Skip recap automatically</span><button id="autoSkipRecap" class="setting-toggle" type="button" role="switch" aria-checked="false"><span></span></button></div>
          <div class="setting-row"><span>Skip credits automatically</span><button id="autoSkipCredits" class="setting-toggle" type="button" role="switch" aria-checked="false"><span></span></button></div>
        </section>

        <section class="settings-section" aria-labelledby="shortcutSectionTitle">
          <div id="shortcutSectionTitle" class="section-title">Keyboard shortcuts</div>
          <button class="shortcut-row" data-shortcut="skip" type="button"><span>Skip active intro / recap / credits</span><kbd id="shortcutSkip">S</kbd></button>
          <button class="shortcut-row" data-shortcut="previous" type="button"><span>Previous episode</span><kbd id="shortcutPrevious">P</kbd></button>
          <button class="shortcut-row" data-shortcut="next" type="button"><span>Next episode</span><kbd id="shortcutNext">N</kbd></button>
        </section>

        <section class="settings-section" aria-labelledby="spoilerSectionTitle">
          <div id="spoilerSectionTitle" class="section-title">Blurring &amp; hiding</div>
          <div class="setting-row"><span>Blur upcoming episode thumbnails</span><button id="blurUpcoming" class="setting-toggle" type="button" role="switch" aria-checked="false"><span></span></button></div>
          <div class="setting-row"><span>Hide upcoming episode titles</span><button id="hideUpcomingTitles" class="setting-toggle" type="button" role="switch" aria-checked="false"><span></span></button></div>
        </section>

        <button id="confirmButton" class="confirm-button" type="button" disabled>Confirm</button>
      </section>

      <footer id="popupFooter" class="popup__footer"><span id="versionText">v2.25</span></footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
