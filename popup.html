<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Better Crunchyroll</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup" aria-label="Better Crunchyroll">
      <header class="popup__header">
        <img class="popup__logo" src="icons/icon128.png" alt="Better Crunchyroll" />
        <button id="settingsButton" class="icon-button" type="button" aria-label="Open settings" title="Settings">⚙</button>
      </header>
      <section id="mainView" class="view" aria-label="Extension controls">
        <div class="control"><button id="toggleButton" class="switch" type="button" role="switch" aria-checked="true" aria-label="Toggle Better Crunchyroll"><span class="switch__thumb" aria-hidden="true"></span></button></div>
      </section>
      <section id="settingsView" class="view settings-view" hidden aria-label="Better Crunchyroll settings">
        <div class="settings-header"><button id="backSettingsButton" class="text-button" type="button">‹ Back</button><strong>Settings</strong></div>
        <label class="setting-row"><span>Skip intro automatically</span><input id="autoSkipIntro" type="checkbox"></label>
        <label class="setting-row"><span>Skip recap automatically</span><input id="autoSkipRecap" type="checkbox"></label>
        <label class="setting-row"><span>Skip credits automatically</span><input id="autoSkipCredits" type="checkbox"></label>
        <label class="setting-row"><span>Blur upcoming episode thumbnails</span><input id="blurUpcoming" type="checkbox"></label>
        <label class="setting-row"><span>Hide upcoming episode titles</span><input id="hideUpcomingTitles" type="checkbox"></label>
        <div class="shortcut-section"><div class="section-title">Keyboard shortcuts</div>
          <button class="shortcut-row" data-shortcut="skip"><span>Skip active intro / recap / credits</span><kbd id="shortcutSkip">S</kbd></button>
          <button class="shortcut-row" data-shortcut="previous"><span>Previous episode</span><kbd id="shortcutPrevious">P</kbd></button>
          <button class="shortcut-row" data-shortcut="next"><span>Next episode</span><kbd id="shortcutNext">N</kbd></button>
          <small id="captureHint" class="capture-hint" hidden>Press a key… Esc to cancel</small>
        </div>
      </section>
      <footer class="popup__footer"><span id="versionText">v2.22</span></footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
