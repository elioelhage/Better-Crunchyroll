<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Better Crunchyroll</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup" aria-label="Better Crunchyroll settings">
      <header class="popup__header">
        <img class="popup__logo" src="icons/icon128.png" alt="Better Crunchyroll" />
      </header>

      <section class="control" aria-label="Extension controls">
        <button id="toggleButton" class="switch" type="button" role="switch" aria-checked="true" aria-label="Toggle Better Crunchyroll">
          <span class="switch__thumb" aria-hidden="true"></span>
        </button>
        <span class="control__label" id="toggleLabel">Enabled</span>
      </section>

      <footer class="popup__footer">
        <span id="versionText">v2.12</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
