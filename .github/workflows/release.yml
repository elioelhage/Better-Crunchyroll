name: Release Better Crunchyroll

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  chromium:
    name: Build Chrome / Edge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Chromium source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          test -f manifest.json
          test -f background.js
          test -f popup.html
          test -f popup.js

      - name: Build Chrome and Edge packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf dist
          mkdir -p dist/chrome dist/edge

          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/chrome/
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/edge/

          node -e 'const fs=require("fs"); for (const dir of ["chrome","edge"]) { const p=`dist/${dir}/manifest.json`; const m=JSON.parse(fs.readFileSync(p,"utf8")); m.version=process.argv[1]; fs.writeFileSync(p,JSON.stringify(m,null,2)+"\n"); }' "$VERSION"

          (cd dist/chrome && zip -qr "../Better-Crunchyroll-v${VERSION}-Chrome.zip" .)
          (cd dist/edge && zip -qr "../Better-Crunchyroll-v${VERSION}-Edge.zip" .)

      - name: Upload Chromium release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Better-Crunchyroll-v${{ steps.version.outputs.version }}-Chrome.zip
            dist/Better-Crunchyroll-v${{ steps.version.outputs.version }}-Edge.zip

  firefox:
    name: Build and publish Firefox
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Firefox source
        uses: actions/checkout@v4
        with:
          ref: main-firefox

      - name: Set release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate Firefox source
        shell: bash
        run: |
          set -euo pipefail
          test -f manifest.json
          test -f background.js
          test -f popup.html
          test -f popup.js

          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (m.browser_specific_settings?.gecko?.id !== 'better-crunchyroll@elioelhage') {
            throw new Error('Unexpected Firefox extension ID');
          }
          if (m.browser_specific_settings?.gecko?.data_collection_permissions?.required?.includes('none') !== true) {
            throw new Error('Firefox data collection declaration is missing');
          }
          NODE

      - name: Set release version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e 'const fs=require("fs"); const p="manifest.json"; const m=JSON.parse(fs.readFileSync(p,"utf8")); m.version=process.argv[1]; fs.writeFileSync(p,JSON.stringify(m,null,2)+"\n");' "$VERSION"

      - name: Build Firefox package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          zip -qr "dist/Better-Crunchyroll-v${VERSION}-Firefox.zip" . -x '.git/*' '.github/*' 'dist/*'

      - name: Submit Firefox update to AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          npm install --global web-ext
          web-ext sign \
            --source-dir . \
            --channel listed \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

      - name: Upload Firefox release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Better-Crunchyroll-v${{ steps.version.outputs.version }}-Firefox.zip
