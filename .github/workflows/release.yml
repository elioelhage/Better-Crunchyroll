name: Release Better Crunchyroll

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate required source files
        shell: bash
        run: |
          set -euo pipefail
          test -f manifest.json
          test -f background.js
          test -f popup.html
          test -f popup.js

      - name: Prepare browser packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf dist
          mkdir -p dist/chrome dist/edge dist/firefox

          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/chrome/
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/edge/
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/firefox/

          # The Git tag is the release source of truth.
          node -e 'const fs=require("fs"); for (const dir of ["chrome","edge","firefox"]) { const p=`dist/${dir}/manifest.json`; const m=JSON.parse(fs.readFileSync(p,"utf8")); m.version=process.argv[1]; fs.writeFileSync(p,JSON.stringify(m,null,2)+"\n"); }' "$VERSION"

          # Firefox-only AMO metadata. Chrome/Edge do not receive this block.
          node <<'NODE'
          const fs = require('fs');
          const path = 'dist/firefox/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.browser_specific_settings = {
            gecko: {
              id: 'better-crunchyroll@elioelhage',
              strict_min_version: '109.0',
              data_collection_permissions: {
                required: ['none']
              }
            }
          };
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE

          (cd dist/chrome && zip -qr "../Better-Crunchyroll-v${VERSION}-Chrome.zip" .)
          (cd dist/edge && zip -qr "../Better-Crunchyroll-v${VERSION}-Edge.zip" .)
          (cd dist/firefox && zip -qr "../Better-Crunchyroll-v${VERSION}-Firefox.zip" .)

      - name: Validate Firefox package
        shell: bash
        run: |
          set -euo pipefail
          unzip -p "dist/Better-Crunchyroll-v${{ steps.version.outputs.version }}-Firefox.zip" manifest.json > /tmp/firefox-manifest.json
          node -e 'const m=require("/tmp/firefox-manifest.json"); if(m.version!==process.argv[1]) process.exit(1); if(m.browser_specific_settings?.gecko?.id!=="better-crunchyroll@elioelhage") process.exit(2);' "${{ steps.version.outputs.version }}"

      - name: Submit Firefox update to AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          npm install --global web-ext
          web-ext sign \
            --source-dir dist/firefox \
            --channel listed \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Better-Crunchyroll-v${{ steps.version.outputs.version }}-Chrome.zip
            dist/Better-Crunchyroll-v${{ steps.version.outputs.version }}-Edge.zip
            dist/Better-Crunchyroll-v${{ steps.version.outputs.version }}-Firefox.zip
